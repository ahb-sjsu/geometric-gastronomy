" font-weight="normal">ripe tomato</text><text x="440.00" y="84.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">A vertex is one pure quality,</text><text x="440.00" y="101.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">an edge a mixture of two,</text><text x="440.00" y="118.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the interior a blend of all five.</text><text x="440.00" y="158.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">Ripe tomato, illustrative weights:</text><text x="440.00" y="175.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">umami 0.40, sweet 0.35, sour 0.20,</text><text x="440.00" y="192.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">salty 0.03, bitter 0.02</text><line x1="440.00" y1="236.00" x2="466.00" y2="236.00" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="1.0"/><text x="474.00" y="240.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">salt to umami mixtures bulge</text><text x="474.00" y="257.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">(Chapter 3; schematic)</text><text x="440.00" y="300.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fa4b8" text-anchor="start" font-weight="normal">Henning's tetrahedron (1916):</text><text x="440.00" y="317.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fa4b8" text-anchor="start" font-weight="normal">four vertices, tastes on its</text><text x="440.00" y="334.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fa4b8" text-anchor="start" font-weight="normal">surface only</text></svg>